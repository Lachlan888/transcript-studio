name: Build and Release Transcript Studio

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate source files
        run: npm run check

      - name: Build macOS DMG
        run: npm run dist

      - name: Verify DMG exists
        run: |
          set -e
          ls -lah dist
          test -n "$(find dist -maxdepth 1 -name '*.dmg' -print -quit)"

      - name: Write release information
        run: node scripts/write-release-info.js

      - name: Show release information
        run: |
          cat dist/release-info.json
          echo ""
          cat dist/release-notes.md

      - name: Upload DMG and publish release notes
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/release-notes.md
          files: |
            dist/*.dmg
            dist/release-info.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
